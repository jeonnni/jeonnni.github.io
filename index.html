<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색줍기</title>
<style>
/* 색줍기 문서 공통 스타일 — 앱 브랜드 팔레트를 그대로 쓴다 */
:root {
  --bg: #FAF2E4;
  --card: #FFFCF6;
  --text: #2B2320;
  --muted: #6F635B;
  --accent: #96603F;
  --line: #E3D7C4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1A1613; --card: #241E1A; --text: #F2EDE6;
    --muted: #A99C92; --accent: #D49B76; --line: #3A312B;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  line-height: 1.75; word-break: keep-all;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
header { border-bottom: 1px solid var(--line); padding-bottom: 24px; margin-bottom: 36px; }
.app { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.app-name { font-size: 20px; font-weight: 700; }
.app-sub { color: var(--muted); font-size: 14px; }
h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.4px; }
h2 { font-size: 18px; margin: 40px 0 12px; letter-spacing: -0.2px; }
h3 { font-size: 15px; margin: 24px 0 8px; }
p, li { font-size: 15px; color: var(--text); }
ul { padding-left: 20px; }
li { margin: 6px 0; }
.meta { color: var(--muted); font-size: 14px; }
a { color: var(--accent); }
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 18px 20px; margin: 16px 0;
}
.card p:first-child, .card ul:first-child { margin-top: 0; }
.card p:last-child, .card ul:last-child { margin-bottom: 0; }
.tag {
  display: inline-block; font-size: 12px; font-weight: 600;
  color: var(--accent); border: 1px solid var(--accent);
  border-radius: 999px; padding: 2px 10px; margin-bottom: 10px;
}
table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; width: 34%; }
footer { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
code { background: var(--card); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-size: 13px; }

/* 좁은 화면에서는 표를 세로로 쌓는다.
   th 를 좁은 열로 두면 "선 택 한 사 진" 처럼 한 글자씩 줄바꿈된다. */
@media (max-width: 560px) {
  table, tbody, tr, th, td { display: block; width: 100%; }
  tr { border-bottom: 1px solid var(--line); padding: 10px 0; }
  tr:last-child { border-bottom: none; }
  th { border: none; padding: 0 0 2px; width: auto; }
  td { border: none; padding: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="app">
      <div>
        <div class="app-name">색줍기</div>
        <div class="app-sub">사진 색상 추출, 컬러 기록</div>
      </div>
    </div>
    <h1>색줍기</h1>
    <p class="meta">사진 속 원하는 픽셀의 색을 정확한 HEX 값으로 읽어내는 iOS 앱</p>
  </header>

  <div class="card">
    <p>사진첩 접근 권한을 묻지 않습니다. 고른 사진 한 장만 기기 안에서 처리하며,
    색은 sRGB 기준으로 변환해 웹·디자인 도구와 같은 값을 보여줍니다.</p>
  </div>

  <h2>문서</h2>
  <ul>
    <li><a href="support.html">고객지원 · 자주 묻는 질문</a></li>
    <li><a href="privacy.html">개인정보 처리방침</a></li>
  </ul>

  <h2>문의</h2>
  <p><a href="mailto:ymymda0711@gmail.com">ymymda0711@gmail.com</a></p>

  <footer>색줍기 · com.saekjupgi.app</footer>
</div>
</body>
</html>
